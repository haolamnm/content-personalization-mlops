[project]
name = "mlops-feature-platform"
version = "0.1.0"
description = "Feast feature definitions and the Iceberg-to-online feature seam"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.2,<2",
    "feast[redis]==0.65.0",
    "pandas>=2.2,<3",
    "pyarrow>=22,<23",
    "pydantic>=2.12,<3",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
    "redis>=4.2,<5",
]

[project.scripts]
feature-materialize = "mlops_features.materialize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_features"]

[dependency-groups]
dev = [
    "basedpyright>=1.39",
    "pandas-stubs>=2.2,<3",
    "pytest>=8,<9",
    "ruff>=0.15",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable Redis instance",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
