name: cdc

# Debezium slice — runs ALONGSIDE the data group, joining its named network.
# Prereq: data group up (make data-up in platform/infra/compose.data.yaml).

services:
  connect:
    image: quay.io/debezium/connect:3.6.1.Final
    restart: unless-stopped
    container_name: cdc-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: cdc-connect-configs
      OFFSET_STORAGE_TOPIC: cdc-connect-offsets
      STATUS_STORAGE_TOPIC: cdc-connect-status
      # single-node Kafka: internal topics cannot satisfy default RF=3
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:${CONNECT_HOST_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - mlops-data

networks:
  mlops-data:
    external: true
