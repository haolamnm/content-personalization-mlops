# Default values for the streaming Flink jobs.
# Shared shape for event-counts and events-lake charts; venue overrides at install time.

replicaCount: 1

image:
  repository: eclipse-temurin
  tag: "25-jre"
  pullPolicy: IfNotPresent   # node-local via ctr import

# The job jar is staged on the node (XDG artifacts dir) and bind-mounted.
# REQUIRED: absolute node path, supplied at install time from the box itself —
# never committed here. helm ... --set jar.hostPath="$HOME/.local/share/mlops/jars"
jar:
  hostPath: ""               # fail-fast template guard below
  fileName: event-counts.jar

# Dev-venue bridge until in-cluster Kafka: pods share the node network so the
# broker's published loopback listener resolves.
hostNetwork: true

javaOpts: >-
  --add-opens=java.base/java.lang=ALL-UNNAMED
  --add-opens=java.base/java.util=ALL-UNNAMED
  --add-opens=java.base/java.io=ALL-UNNAMED
  --add-opens=java.base/java.net=ALL-UNNAMED
  --add-opens=java.base/java.nio=ALL-UNNAMED
  --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

env:
  KAFKA_BOOTSTRAP_SERVERS: localhost:29094

# single source for both the job config and its liveness probe
checkpointDir: "/tmp/flink-checkpoints"

# Optional reference to an existing Secret whose keys are injected as env vars
# (used by events-lake for catalog/object-store credentials).
envSecretRef: ""

resources: {}
